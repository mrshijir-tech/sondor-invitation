
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitation de Sondor</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:24px 16px;
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;text-align:center;color:#8b5270;
  background:linear-gradient(145deg,#fff8fc,#f5dce9,#fffafc)
}
.card{
  width:100%;max-width:420px;background:#fff;
  border:1px solid #edc8db;border-radius:26px;
  padding:30px 22px;box-shadow:0 12px 36px #b77d982b
}
h1{font-size:29px;margin:8px 0 12px}
p{line-height:1.6}
input,button{
  width:100%;padding:15px;margin-top:12px;
  border-radius:13px;font-size:17px
}
input{border:1px solid #dfb5cb}
button{
  border:0;background:#d98bb2;color:white;
  font-weight:bold;cursor:pointer
}
#hello{display:none;font-size:25px;font-weight:bold}
#video{display:none;margin-top:20px}
iframe{width:100%;aspect-ratio:9/16;border:0;border-radius:16px}
.small{font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:38px">🎀 ✨ 🎂</div>
  <h1>Sondor fête ses 11 ans !</h1>
  <p>Une journée magique se prépare…</p>
  <p>Écris ton prénom pour découvrir ton invitation personnelle.</p>
  <input id="name" placeholder="Ton prénom" maxlength="35">
  <button onclick="invite()">Découvrir mon invitation ✨</button>
  <div id="hello">
    <p id="greeting"></p>
    <p class="small">J’ai hâte de fêter ça avec toi !</p>
  </div>
  <div id="video">
    <p>🎬 Voici mon invitation vidéo !</p>
    <iframe id="player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>
<script>
function invite(){
  const name=document.getElementById('name').value.trim();
  if(!name){alert('Écris ton prénom !');return;}
  document.getElementById('greeting').textContent='Tu es invitée, '+name+' ! 💗';
  document.getElementById('hello').style.display='block';
  document.getElementById('video').style.display='block';
  document.getElementById('player').src=
  'https://www.youtube-nocookie.com/embed/3vwz0X5sGpc?autoplay=1&playsinline=1';
}
</script>
</body>
</html>
